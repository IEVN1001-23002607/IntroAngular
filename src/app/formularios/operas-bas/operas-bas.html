<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="raw">
           <div class="col-6">
             <form action="">
                <div class="form-group pt-4">
                    <label for="num1">Numero 1: </label>
                    <input [(ngModel)]="num1" name="num1" type="text" id="num1" class="form-control" placeholder="Ingrese numero 1">
                </div>
                <div class="form-group pt-4">

                    <label for="num2">Numero 2: </label>
                    <input [(ngModel)]="num2" type="text" id="num2" name="num2" class="form-control" placeholder="Ingrese numero 2">
                </div>
                <br>
                <!-- <button (click)="sumar()" type="button" class="btn btn-primary">Sumar</button>
                <br>
                <button (click)="restar()" type="button" class="btn btn-primary">restar</button>
                <br>
                <button (click)="multiplicar()" type="button" class="btn btn-primary">multiplicar</button>
                <br>
                <button (click)="dividir()" type="button" class="btn btn-primary">dividir</button> -->


                <div class="form-group pt-4">
                    <label>
                        <input type="radio" name="operacion" value="sumar" [(ngModel)]="operacion"> Sumar
                    </label><br>
                    <label>
                        <input type="radio" name="operacion" value="restar" [(ngModel)]="operacion"> Restar
                    </label><br>
                    <label>
                        <input type="radio" name="operacion" value="multiplicar" [(ngModel)]="operacion"> Multiplicar
                    </label><br>
                    <label>
                        <input type="radio" name="operacion" value="dividir" [(ngModel)]="operacion"> Dividir
                    </label>
                    </div>
                
                <button (click)="calcular()" type="button" class="btn btn-primary">calcular</button>


            </form>
           </div>
           <div class="col-6">

            <h2>Resultado: {{resultado}}</h2>
           </div>
        </div>
    </div>
</body>
</html>
