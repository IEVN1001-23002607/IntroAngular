<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
           <div class="col-6">
             <form action="">
                <h1>INICIO DE SESION</h1>

                <div class="form-group pt-4">
                    <label for="usuario">usuario:  </label>
                    <input #usuario name="usuario" type="text" id="usuario" class="form-control" placeholder="Ingrese el usurio">
                </div>

                <div class="form-group pt-4">
                    <label for="contra">contraseña: </label>
                    <input #contra type="text" id="contra" name="contra" class="form-control" placeholder="Ingrese se contraseña">
                </div>
                
                
                
                
               <button (click)="calcular(usuario.value, contra.value)" type="button" class="btn btn-primary">INICIAR</button>


            </form>
           </div>
           <div class="col-6">

            <h4 class="mt-4">{{resultado}}</h4>
           </div>
        </div>
    </div>
</body>
</html>
